name: Radar collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: radar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet requests

      - name: Collect and score
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/collect.py

      - name: Commit data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nessun cambiamento"; exit 0; fi
          git commit -m "data: aggiornamento $(date -u +%Y-%m-%dT%H:%MZ)" --quiet
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
